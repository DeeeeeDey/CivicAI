openapi: 3.0.0
info:
  title: CivicAI API
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      summary: Login to your account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "citizen@civicai.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
        '401':
          description: Invalid credentials
